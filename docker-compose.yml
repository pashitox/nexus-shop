version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: nexusshop_db
    environment:
      POSTGRES_DB: nexus_shop
      POSTGRES_USER: nexus_user
      POSTGRES_PASSWORD: nexus_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - nexus_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_user -d nexus_shop"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusshop_backend
    # ⚠️ REMOVIMOS TODAS LAS VARIABLES DE AQUÍ - se cargarán desde backend/.env
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nexus_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusshop_frontend
    # ⚠️ REMOVIMOS TODAS LAS VARIABLES DE AQUÍ - se cargarán desde frontend/.env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexus_network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  nexus_network:
    driver: bridge
